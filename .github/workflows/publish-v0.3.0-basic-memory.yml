name: Publish v0.3.0 basic memory release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.3.0-basic-memory.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v0.3.0-basic-memory" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists."
            exit 0
          fi

          gh release create "v0.3.0-basic-memory" \
            --repo "$GITHUB_REPOSITORY" \
            --target "3c1e557674c7045ca18df2e361541bf72cec5d21" \
            --title "v0.3.0 — Basic Memory Baseline" \
            --notes "Stable rollback baseline for the first usable memory-library release.\n\nIncluded capabilities:\n- structured memory creation and validation\n- workspace and confidentiality isolation\n- deterministic JSONL export with SHA-256 manifest\n- context transitions\n- local SQLite FTS5 indexing and filtered search\n- ChatGPT official ZIP import\n- authenticated live ChatGPT context archiving to Mac\n\nKnown limitations:\n- no automatic long-term memory extraction or approval workflow\n- raw ChatGPT archives are not yet part of unified search\n- no attachment/PDF ingestion, Zotero/EndNote sync, semantic vector search, MCP, or controller agent"
