name: Publish v0.3.1 manual import release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.3.1-manual-import.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v0.3.1-manual-import" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists."
            exit 0
          fi

          gh release create "v0.3.1-manual-import" \
            --repo "$GITHUB_REPOSITORY" \
            --target "78647c48d3c63e81e543038eb61e08a628331ce8" \
            --title "v0.3.1 — Manual Import Baseline" \
            --notes "Stable rollback baseline after removing live ChatGPT archiving.\n\nIncluded capabilities:\n- structured memory creation and validation\n- workspace and confidentiality isolation\n- deterministic JSONL export with SHA-256 manifest\n- context transitions\n- local SQLite FTS5 indexing and filtered search\n- manual ChatGPT official export ZIP import with idempotent updates\n\nRemoved from this release:\n- private GPT Action live archive\n- Bearer-token HTTP receiver\n- Tailscale Funnel integration\n- live archive documentation and tests\n\nKnown limitations:\n- no automatic long-term memory extraction or approval workflow\n- imported raw conversations are not yet part of unified search\n- no attachment/PDF ingestion, Zotero/EndNote sync, semantic vector search, MCP, or controller agent"
