name: Review Hermes upstream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate selective-port report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/check_hermes_updates.py check --markdown hermes-upstream-review.md
          cat hermes-upstream-review.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-upstream-review
          path: hermes-upstream-review.md
