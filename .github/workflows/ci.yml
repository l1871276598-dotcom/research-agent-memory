name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > "test-output-macOS.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 220 "test-output-macOS.log"
          else
            cat "test-output-macOS.log"
          fi
          exit "$status"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-macOS
          path: test-output-macOS.log

      - run: python -m compileall -q src tests
      - run: git diff --check
